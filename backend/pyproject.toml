[project]
name = "pydantic-ai-chat"
version = "0.2.0"
description = "Minimal Ollama chat with conversation-owned E2B sandboxes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-ai-slim[openai]>=2.49,<3",
    "e2b>=2.51,<3",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
